    <!--
      Content Security Policy
      ───────────────────────
      Mantida aqui (meta tag) e NÃO no .htaccess para evitar conflito entre
      dois CSPs simultâneos (browser aplica intersecção mais restritiva).

      connect-src inclui Iconify API explicitamente porque @iconify/vue v4
      busca ícones SVG de api.iconify.design em tempo de execução.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';

      script-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://fonts.gstatic.com
        https://www.googletagmanager.com
        https://www.google-analytics.com
        https://www.google.com
        https://www.gstatic.com
        https://challenges.cloudflare.com
        https://static.cloudflareinsights.com;

      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com;

      font-src 'self' data:
        https://fonts.gstatic.com;

      img-src 'self' data: blob: https:;

      frame-src 'self'
        https://www.google.com
        https://challenges.cloudflare.com
        https://www.googletagmanager.com
        https://www.openstreetmap.org;

      connect-src 'self'
        https://api.iconify.design
        https://api.simplesvg.com
        https://api.unisvg.com
        https://www.google-analytics.com
        https://analytics.google.com
        https://stats.g.doubleclick.net
        https://region1.google-analytics.com
        https://www.googletagmanager.com
        https://challenges.cloudflare.com
        https://www.google.com
        https://www.gstatic.com;

      frame-ancestors 'self';
      base-uri 'self';
      form-action 'self';
    " />
