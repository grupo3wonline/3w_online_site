<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>

    <!-- SEO -->
    <title>Consolidador de Excel & CSV — Unificação Inteligente de Planilhas</title>
    <meta
      name="description"
      content="Unifique múltiplos arquivos Excel e CSV em uma única tabela consolidada. Processamento 100% local no navegador, sem envio de dados. Ferramenta gratuita e segura."

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Consolidador de Excel & CSV" />

      property="og:description"

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
