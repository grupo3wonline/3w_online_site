<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #6d28d9, #a21caf 55%, #db2777);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .dots {
        position: absolute; inset: 0; opacity: 0.18;
        background-image: radial-gradient(circle at 20% 20%, #fff 2px, transparent 2px);
        background-size: 44px 44px;
      }
      .card {
        position: relative;
        width: 1080px;
        padding: 72px 80px;
        display: flex;
        gap: 56px;
        align-items: center;
      }
      .badge {
        display: inline-flex; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.18);
        padding: 10px 20px; border-radius: 999px;
        font-size: 26px; font-weight: 600; margin-bottom: 22px;
      }
      h1 { font-size: 74px; line-height: 1.05; font-weight: 800; letter-spacing: -2px; }
      h1 .u { text-decoration: underline; text-decoration-color: #f9a8d4; text-decoration-thickness: 8px; }
      p { font-size: 30px; opacity: 0.92; margin-top: 22px; max-width: 620px; }
      .foot { margin-top: 30px; font-size: 24px; opacity: 0.85; }
      .icon {
        flex-shrink: 0;
        width: 240px; height: 300px;
        background: #fff; border-radius: 28px;
        display: flex; flex-direction: column; align-items: center;
        padding: 28px 24px; gap: 18px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      }
      .screen {
        width: 100%; height: 70px; border-radius: 12px;
        background: linear-gradient(135deg, #6d28d9, #db2777);
      }
      .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; }
      .key { height: 44px; border-radius: 10px; background: #ede9fe; }
      .key.p { background: #db2777; }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="card">
      <div>
        <span class="badge">⚕️ Ferramenta gratuita de saúde</span>
        <h1>Calculadora de <span class="u">IMC</span> Online</h1>
        <p>IMC, taxa metabólica, hidratação e metas nutricionais. Rápida e 100% privada.</p>
        <div class="foot">3wonline.com.br/calculadora_imc</div>
      </div>
      <div class="icon">
        <div class="screen"></div>
        <div class="keys">
          <div class="key"></div><div class="key"></div><div class="key"></div>
          <div class="key"></div><div class="key"></div><div class="key p"></div>
          <div class="key"></div><div class="key"></div><div class="key p"></div>
        </div>
      </div>
    </div>
  </body>
</html>
