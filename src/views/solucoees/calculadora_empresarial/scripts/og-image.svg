<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="220" fill="#ffffff" opacity="0.08"/>
  <circle cx="150" cy="560" r="260" fill="#ffffff" opacity="0.06"/>

  <!-- Icone calculadora -->
  <g transform="translate(90,190)">
    <rect x="0" y="0" width="150" height="200" rx="24" fill="url(#card)"/>
    <rect x="22" y="24" width="106" height="44" rx="10" fill="#0f172a"/>
    <g fill="#2563eb">
      <rect x="22" y="86" width="28" height="28" rx="7"/>
      <rect x="61" y="86" width="28" height="28" rx="7"/>
      <rect x="100" y="86" width="28" height="28" rx="7"/>
      <rect x="22" y="124" width="28" height="28" rx="7"/>
      <rect x="61" y="124" width="28" height="28" rx="7"/>
      <rect x="100" y="124" width="28" height="28" rx="7"/>
      <rect x="22" y="162" width="67" height="28" rx="7"/>
      <rect x="100" y="162" width="28" height="28" rx="7" fill="#10b981"/>
    </g>
  </g>

  <!-- Texto -->
  <text x="300" y="250" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Calculadora</text>
  <text x="300" y="335" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Empresarial</text>
  <text x="300" y="400" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#e2e8f0">19+ ferramentas gratuitas para empreendedores</text>

  <!-- Badge -->
  <g transform="translate(300,440)">
    <rect x="0" y="0" width="290" height="52" rx="26" fill="#ffffff" opacity="0.18"/>
    <text x="26" y="34" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">100% Gratuito • Sem Cadastro</text>
  </g>

  <text x="300" y="560" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff" opacity="0.9">www.3wonline.com.br</text>
</svg>
