<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Abstract Background Elements -->
  <circle cx="400" cy="300" r="300" fill="url(#grad1)" opacity="0.05" />
  <circle cx="600" cy="100" r="100" fill="#7c3aed" opacity="0.1" />
  <circle cx="100" cy="500" r="150" fill="#4f46e5" opacity="0.1" />

  <!-- Code Window Main -->
  <g transform="translate(150, 100)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="500" height="350" rx="10" ry="10" fill="#1e1e1e" filter="url(#glow)" stroke="#333" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="30" rx="10" ry="10" fill="#2d2d2d" />
    <rect x="0" y="15" width="500" height="15" fill="#2d2d2d" /> <!-- Cover bottom radius of header -->
    
    <!-- Window Controls -->
    <circle cx="20" cy="15" r="5" fill="#ff5f56" />
    <circle cx="40" cy="15" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="15" r="5" fill="#27c93f" />

    <!-- Sidebar -->
    <rect x="0" y="30" width="40" height="320" fill="#252526" />
    
    <!-- Code Lines -->
    <g transform="translate(60, 50)">
       <!-- Line 1 -->
       <rect x="0" y="0" width="100" height="10" rx="2" fill="#d4d4d4" opacity="0.3"/>
       <rect x="110" y="0" width="50" height="10" rx="2" fill="#569cd6" />
       
       <!-- Line 2 -->
       <rect x="20" y="20" width="80" height="10" rx="2" fill="#c586c0" />
       <rect x="110" y="20" width="120" height="10" rx="2" fill="#d4d4d4" opacity="0.5"/>
       
       <!-- Line 3 -->
       <rect x="40" y="40" width="200" height="10" rx="2" fill="#ce9178" />

       <!-- Line 4 -->
       <rect x="40" y="60" width="60" height="10" rx="2" fill="#4fc1ff" />
       <rect x="110" y="60" width="80" height="10" rx="2" fill="#dcdcaa" />

       <!-- Line 5 -->
       <rect x="20" y="80" width="30" height="10" rx="2" fill="#d4d4d4" opacity="0.3"/>

       <!-- Cursor -->
       <rect x="40" y="60" width="2" height="15" fill="#7c3aed">
         <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
       </rect>
    </g>

    <!-- Floating Badge -->
    <g transform="translate(380, 280)">
       <circle cx="30" cy="30" r="40" fill="url(#grad1)" />
       <text x="30" y="40" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24" fill="white">&lt;/&gt;</text>
    </g>
  </g>

  <!-- Mobile Phone Overlay -->
  <g transform="translate(50, 250)">
     <rect x="0" y="0" width="120" height="220" rx="15" ry="15" fill="#0f172a" stroke="#334155" stroke-width="4"/>
     <rect x="5" y="5" width="110" height="210" rx="10" ry="10" fill="#1e293b" />
     
     <!-- Screen Content -->
     <rect x="15" y="30" width="90" height="60" rx="4" fill="#334155" opacity="0.5"/>
     <rect x="15" y="100" width="90" height="8" rx="2" fill="#475569" />
     <rect x="15" y="115" width="70" height="8" rx="2" fill="#475569" />
     
     <!-- Notch -->
     <path d="M 40 0 L 80 0 L 80 10 C 80 12 78 14 76 14 L 44 14 C 42 14 40 12 40 10 Z" fill="#0f172a"/>
  </g>
</svg>
